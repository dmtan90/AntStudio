services:
  # ==========================================
  # DATABASE (MongoDB)
  # ==========================================
  mongo:
    image: mongo:6
    container_name: antstudio-mongo
    restart: unless-stopped
    # Not published to the host: only reachable on the compose network.
    # To inspect locally, temporarily add: ports: ["127.0.0.1:27017:27017"]
    volumes:
      - mongo_data:/data/db
    networks:
      - antstudio-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # BACKEND SERVER (Express + Socket.IO + NMS)
  # ==========================================
  antstudio-server:
    container_name: antstudio-server
    restart: unless-stopped
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "${PORT:-4000}:${PORT:-4000}"
      - "1935:1935" # RTMP ingest (publish/play require a server-signed URL)
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-4000}
      - MONGODB_URI=${DOCKER_MONGODB_URI:-mongodb://mongo:27017/antstudio}
    volumes:
      - uploads_data:/app/server/uploads
      - logs_data:/app/server/logs
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - antstudio-network
    stop_grace_period: 20s # time for graceful shutdown (FFmpeg relays, sockets)

  # ==========================================
  # FRONTEND CLIENT (Vue 3 + Nginx SPA)
  # ==========================================
  antstudio-client:
    container_name: antstudio-client
    restart: unless-stopped
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - antstudio-server
    networks:
      - antstudio-network

networks:
  antstudio-network:
    driver: bridge

volumes:
  mongo_data:
  uploads_data:
  logs_data:
