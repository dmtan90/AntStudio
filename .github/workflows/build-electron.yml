name: Build Electron Multi-Platform

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build for ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: mac
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install Dependencies
        shell: bash
        run: |
          if [ ! -f pnpm-workspace.yaml ]; then
            echo "packages:" > pnpm-workspace.yaml
            echo "  - 'genblaze'" >> pnpm-workspace.yaml
            echo "  - 'client'" >> pnpm-workspace.yaml
            echo "  - 'server'" >> pnpm-workspace.yaml
            echo "  - 'electron'" >> pnpm-workspace.yaml
          fi
          pnpm install --no-frozen-lockfile
        env:
          NODE_ENV: development
          YOUTUBE_DL_SKIP_DOWNLOAD: "true"
          YTDLP_SKIP_DOWNLOAD: "true"

      - name: Build Web Client & Server
        run: pnpm run build

      - name: Build Electron Binary
        run: pnpm run build:electron:${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AntStudio-${{ matrix.target }}
          path: electron/dist/
