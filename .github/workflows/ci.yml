name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm (version from package.json "packageManager")
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build genblaze (server depends on its output)
        run: pnpm --filter genblaze build

      - name: Typecheck server
        run: pnpm --filter server exec tsc --noEmit -p tsconfig.json

      - name: Typecheck client
        run: pnpm --filter client exec vue-tsc --noEmit

      - name: Bundle server
        run: pnpm --filter server build
